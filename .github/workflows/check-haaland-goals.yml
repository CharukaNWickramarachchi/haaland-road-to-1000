name: Update Haaland Goals

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: write

concurrency:
  group: haaland-goal-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Detect, publish, validate and test goals
        env:
          BSD_FOOTBALL_KEY: ${{ secrets.BSD_FOOTBALL_KEY }}
        run: npm run auto-update

      - name: Build application
        run: npm run build

      - name: Check production-data changes
        id: changes
        shell: bash
        run: |
          if git diff --quiet -- \
            data/goals.json \
            data/canonical/goals.json \
            data/incoming/goal-candidates.json \
            data/data-version.json \
            data/verified-baseline.json \
            data/sources.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit automatic goal update
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "haaland-goal-bot"
          git config user.email "actions@users.noreply.github.com"

          git add \
            data/goals.json \
            data/canonical/goals.json \
            data/incoming/goal-candidates.json \
            data/data-version.json \
            data/verified-baseline.json \
            data/sources.json

          git commit -m "Auto-update Haaland career goals"
          git push
