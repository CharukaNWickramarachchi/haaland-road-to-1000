name: Check Haaland Goals

on:
  workflow_dispatch:

  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write

jobs:
  detect:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Detect new goals
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: npm run detect-goals

      - name: Check for candidate changes
        id: changes
        run: |
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit candidate updates
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "haaland-goal-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/incoming data/automation
          git commit -m "Detect new Haaland goal candidates"
          git push
